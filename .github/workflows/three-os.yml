# Три системы: Ubuntu, macOS, Windows (заведено шагом 258, 2026-09-20).
#
# 🔒 ЗАЧЕМ. Продукт ставится на ДОМАШНЮЮ машину человека, а машин три рода.
# Разрабатывается он на Windows, и два класса отказов на ней не возникают в
# принципе: регистр в путях (Linux строже) и нативные сборки под чужую
# архитектуру. Раннеры GitHub дают обе системы даром, пока репозиторий публичный.
#
# 🛑 ЧТО ЭТОТ ПРОГОН НЕ ДОКАЗЫВАЕТ, И ЭТО ВАЖНЕЕ ТОГО, ЧТО ОН ДОКАЗЫВАЕТ:
#   · установку «одной фразой» — раннер не человек за своим компьютером;
#   · автозапуск при загрузке (systemd, launchd, папка автозагрузки);
#   · pm2 startup с sudo, туннель, cloudflared — их здесь нет намеренно;
#   · linux-arm64 и musl (Alpine): раннер даёт x64-glibc, а Мак — arm64-darwin.
# Зелёный цвет здесь означает «код собирается на трёх системах», а не
# «продукт на них работает». Второе доказывается только живым прогоном.

name: three-os

on:
  push:
    branches: ["main", "new-step-*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false        # системы отчитываются независимо: расхождение колонок и есть ответ
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Зависимости (здесь падают нативные сборки под чужую архитектуру)
        run: npm ci

      - name: Регистр в путях (на Windows и macOS всегда зелено — красным бывает только Linux)
        run: npm run check:case

      - name: Сборка со всеми сторожами
        run: npm run build
